<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal API SDE Micro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .container { max-width: 1100px; margin: auto; padding: 30px; }
    .header {
      background: #111827; color: white; padding: 30px;
      border-radius: 15px; margin-bottom: 25px;
    }
    .header h1 { margin: 0 0 10px; }
    .header p { margin: 0; opacity: .8; }
    .card {
      background: white; border-radius: 15px; padding: 25px;
      margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }
    .service {
      border: 1px solid #e5e7eb; padding: 18px;
      border-radius: 10px; margin-bottom: 12px;
    }
    .method {
      display: inline-block; padding: 5px 10px; border-radius: 6px;
      font-size: 12px; font-weight: bold; background: #e5e7eb;
      margin-right: 10px;
    }
    .endpoint { font-family: monospace; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #f9fafb; }
    button {
      padding: 10px 18px; border: none; border-radius: 8px;
      cursor: pointer; background: #111827; color: white;
    }
    .status { margin-top: 15px; padding: 12px; border-radius: 8px; background: #f3f4f6; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Universal API SDE Micro</h1>
    <p>Cloudflare Worker + D1</p>
  </div>

  <div class="card">
    <h2>API Services</h2>
    <div id="services">Loading...</div>
  </div>

  <div class="card">
    <h2>Sensor Data</h2>
    <button onclick="loadSensorData()">Refresh Data</button>
    <div id="status" class="status">Menunggu data...</div>
    <br>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Device</th>
            <th>Temperature</th>
            <th>Humidity</th>
            <th>CO2</th>
            <th>Recorded At</th>
          </tr>
        </thead>
        <tbody id="sensorTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
async function loadServices() {
  try {
    const response = await fetch("/api");
    const result = await response.json();
    const container = document.getElementById("services");
    container.innerHTML = "";

    result.services.forEach(service => {
      const div = document.createElement("div");
      div.className = "service";
      div.innerHTML = `
        <span class="method">${service.method}</span>
        <span class="endpoint">${service.endpoint}</span>
        <br><br>
        <small>${service.description}</small>
      `;
      container.appendChild(div);
    });
  } catch (error) {
    document.getElementById("services").textContent = "Gagal mengambil daftar API.";
  }
}

async function loadSensorData() {
  const status = document.getElementById("status");
  status.textContent = "Mengambil data...";

  try {
    const response = await fetch("/api/sensor-data");
    const result = await response.json();
    const table = document.getElementById("sensorTable");
    table.innerHTML = "";

    if (!result.success) throw new Error(result.message);

    result.data.forEach(sensor => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${sensor.id}</td>
        <td>${sensor.device_id}</td>
        <td>${sensor.temperature} °C</td>
        <td>${sensor.humidity} %</td>
        <td>${sensor.co2} ppm</td>
        <td>${sensor.recorded_at ?? ""}</td>
      `;
      table.appendChild(row);
    });

    status.textContent = `Total data: ${result.count}`;
  } catch (error) {
    status.textContent = "Gagal mengambil data sensor: " + error.message;
  }
}

loadServices();
loadSensorData();
</script>
</body>
</html>
